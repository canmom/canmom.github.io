comment: >-
  Just stumbled upon this liveblog yesterday after recently finishing umineko
  myself throughout the last month or so. It's been a blast, I hope you continue
  to see this through to the end.

  I love the way the narrative both challenges and kind of rehabilitates Knox,
  here. Obviously, Erika's munchkin style of detective-ing is missing the point,
  but she and Bern aren't wrong to shit-talk most of Battler's previous strats.

  Call it love, or call it honorable combat, more than anything this Episode is
  about the mystery genre itself, and the relationship between author and
  reader. Whether or not you subscribe to any particular list of rules, the game
  is assuring you that it is acting in good-faith.

  At this point is when I went back and attempted to "solve" all the previous
  boards. I did pretty alright, all things considered.
