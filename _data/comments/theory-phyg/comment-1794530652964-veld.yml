comment: >-
  i fell into a t4t cult by accident. it took me awhile to notice because i had
  a lovely and normal friendship with these people for a year. things only got
  weird after i had a big falling out with my main friend group and was suddenly
  socially isolated by my own volition. everyone else in the cult was already
  isolated without the leader having to do anything by virtue of being visibly
  trans, autistic, a furry, poorly socialized etc. i was drawn in because i’m an
  autistic tranny who, for better or worse, is very well assimilated. i felt
  like these people gave me permission to be authentically weird in a way that
  would make most other people very uncomfortable.


  i started dating the cult leader and she assaulted me many times, so i angrily
  broke up with her. suddenly everyone was mad at me for pissing her off. in a
  final conversation i told one of the girls that my ex is actively dangerous
  and she needs to get away from her. she told me that my ex was “the center of
  our world” and she couldn’t imagine leaving her.


  after that i realized that my ex represented vastly different things to each
  of us. to me, she was a beloved girlfriend. to them she was a replacement for
  having intrinsic desires, a way to get out of making decisions. she decides
  everything for them: the next project, where to go, what to watch, who to hang
  out with. her three followers seemed to need her to have an opinion on things
  as trivial as what music to put on. when she wasn’t in the room, they were
  lifeless. like, literally sitting around and staring at the wall. it was
  weird. i would have to step in and become the person who makes shit happen
  until she returned. i think that not being able to experience, much less
  assert your own desires is so trans. my transness left me with a lingering
  dissociative relationship to my feelings. she was able to prey on that
  specific transgender trauma of having your own desire beaten out of you from
  birth. 


  everyone in the cult except for me was an active tumblr user and had a
  dogmatic way of looking at the discourse - i think my ex downplayed it around
  me because she knew i was not a part of that subculture. she did a very clever
  thing of concealing her sexual abuse by always gesturing towards the tumblr
  hate campaigns that fall on trans women for having unusual kinks. therefore,
  any critique of her was transmisogyny and an attempt to “socially murder” her
  (doubly so for me as a trans guy, ie a patriarch in these circles). she never
  had to say that out loud: her followers believed it enough that it became an
  unquestionable truth. in reality she was using tumblr kink posts as a way to
  test people’s boundaries. she sent me a “joke” post about stealthing before we
  had sex for the first time. i should’ve taken that as a huge red flag. word of
  advice for anyone who needs it: if someone has been doing bdsm for years but
  somehow has never read a book about it, something has gone terribly wrong.


  the cult also had a lot of hard-to-communicate inside jokes and lore, a belief
  that cutting someone off was doing them a great harm no matter how badly they
  behaved (influenced by tumblr discourse on social murder), and one girl who
  was usually the butt of jokes who i later realized was receiving most of the
  abuse. the leader would also encourage us to test each other’s boundaries -
  one time all of them insisted i rank them from least to most passing. i
  assumed everyone was as capable of expressing their comfort levels as i was,
  so after asking (a lot!) if each of them was sure, i did it. later on i
  realized everyone in the room had bad boundaries and these sorts of games only
  wear them down further. 


  all this to say i also learned how to identify a cult the hard way. in a way
  i’m glad the experience was brief and the cult was small, because i also grew
  up reading yudkowski and i think i would’ve eventually wanted to visit the
  lighthaven campus if i hadn’t had this experience. thanks for your write up,
  it helped me process some things.
