comment: "this was great! some really good ideas here! I like this thing you were touching on about autistic consciousness and how we might consider autistic personality to be a rigid switch between social codes, unable to integrate them all\nI've been writing an essay for the past year about essentially this, from a media analysis and philosophy perspective. I'm actually exploring the deleuze and guattari connection you mentioned at the start of this article. \n\ni think you'll enjoy their notion of \"the body without organs\" (a term they got from Antonin Artaud). its hard to refer to it, as you mention, but I'm thinking about it like \"the system without alters\", or \"the tv show without characters\", or maybe \"the chess board without pieces\". imagine that the tv show itself (the empty truman show, lets say) is the background, and the characters are the figureground. a tv show with no characters has no \"organs\" can have no organisation, no direction, no desires, nothing happens. the tv show neither dead nor alive, or rather, it is not playing and the system is integrated and whole. deleuze and guattari say that this combination of all the parts is in itself a part of the system, and it does not truly totalise or unify the whole. (see/skim ch 1.6 of d&g's anti-oedipus for poetic musings on this)\nfor example, my system calls itself the acadia system not because the \"main fronter/host\" is called acadia, because, though drugs, we were able to \"overload the severance chip\" so to speak, and the dissociation stopped all at once for a few evenings, revealing someone who claimed/appropriated the entirety of the experience/memory of the system. we are an australian system, but one of the system-mates at the time had a british accent. Acadia did not have this accent, and therefore she does not represent the entire potential of the system.\npluralpedia calls this the \"godlet\" alter, the one who *believes* they are the deity of the system. i believe they make the distinction for similar reasons to Deleuze and Guattari.\n\nHow does one stop being a way? as you mentioned: death. a character can be retired if its been determined that the system \"doesn't need that character\" or actively doesn't want to be that way anymore. perhaps its something specific embedded within a character that needs to go. my old host, Gwen, couldn't accept a specific aspect of our childhood trauma, and it turns out that this was part of her desigm: to live the perfect idealised life, where *that thing* didn't happen. During a trip, Gwen was able to realise how much of a hindrance that was on the system, and so left, accepting her trauma and undoing her binding existence. the body no longer needed that organ. \n\n\n\n\n\t\"[...]But, besides all this, death is the great opportunity no longer to be I;—to him who uses it. During life the will of man is without freedom: his action takes place with necessity upon the basis of his unalterable character in the chain of motives. But every one remembers much that he has done, and on account of which he is by no means satisfied with himself. If now he were to go on living, he would go on acting in the same way, on account of the unalterable nature of his character. Accordingly he must cease to be what he is in order to be able to arise out of the germ of his nature as a new and different being. Therefore death looses these bonds; the will again becomes free; for freedom lies in the Esse, not in the Operari[...]\" Arthur Schopenhauer\n\n\ngood luck with your exploration of consciousness! i really encourage you to look further! Nietzsche has some cool bonus notions on consciousness being a death mask, chains that bind."
